<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    VERBORA — the landing page (served at /). Plain HTML: it is on screen at
    once, while the demo (/app/, several MB) loads in the phone frame on a
    wide screen, or opens on a tap on a phone.

    The site collects nothing: no form, no waiting list (until there is a
    company to run one). Its one call besides the demo is a plain link to
    the Instagram account named in app/site.js.

    Two languages in one file: every text has data-en / data-tr, picked from
    the browser's language (or ?lang=tr / ?lang=en).

    The site may live at the root of a domain or under a path
    (…github.io/verbora-demo/): every address here is relative. The one
    absolute address, the picture shown when the link is shared, is filled
    in by tools/web_demo/build.sh (https://omerfrkuyk.github.io/verbora-demo/).
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Closed to search engines until launch (tools/web_demo/build.sh --public removes it). -->
  <meta name="robots" content="noindex">
  <title>Verbora: learn a language one word puzzle at a time</title>
  <meta name="description" content="Word puzzles that teach you a language: English, Spanish, German, French, Italian, from A1 to C1. Play the demo in your browser.">
  <meta name="theme-color" content="#0D1F2D">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Verbora: learn a language one word puzzle at a time">
  <meta property="og:description" content="Join the letters, find the word, learn what it means and how it sounds. Play the demo in your browser.">
  <meta property="og:image" content="https://omerfrkuyk.github.io/verbora-demo/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="app/favicon.png">
  <link rel="apple-touch-icon" href="app/icons/Icon-192.png">

  <style>
    @font-face {
      font-family: 'Fredoka';
      font-weight: 600;
      font-display: swap;
      src: url('app/assets/assets/fonts/Fredoka-SemiBold.ttf') format('truetype');
    }
    :root {
      --desk: #0D1F2D;
      --desk-2: #122A3D;
      --slab: #16344A;
      --paper: #F4E3B8;
      --paper-edge: #CDB27A;
      --ink: #1B2A38;
      --lime: #C8FF3D;
      --lime-edge: #6F9A12;
      --key: #1F4A66;
      --key-edge: #0C2130;
      --cream: #F4F1E8;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(1100px 700px at 75% 20%, var(--desk-2), var(--desk) 65%);
      color: var(--cream);
      font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    h1, h2, h3, .mark, .key { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; }
    a { color: inherit; }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 22px 20px 40px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }
    .mark { font-size: 30px; letter-spacing: 0.4px; color: var(--paper); }
    .lang {
      font-size: 14px;
      opacity: 0.75;
      background: none;
      border: 0;
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
      padding: 8px 0 8px 8px;
    }

    .grid { display: grid; gap: 34px; }
    h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.1; margin: 0 0 14px; color: var(--paper); }
    .lead { font-size: 17px; opacity: 0.85; margin: 0 0 22px; max-width: 34em; }

    .keys { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .key {
      display: inline-block;
      border: 0;
      border-radius: 16px;
      padding: 14px 22px;
      font-size: 18px;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      background: var(--lime);
      color: var(--ink);
      box-shadow: 0 5px 0 var(--lime-edge);
    }
    .key.dark { background: var(--key); color: var(--paper); box-shadow: 0 5px 0 var(--key-edge); }
    .key:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--lime-edge); }
    .key.dark:active { box-shadow: 0 2px 0 var(--key-edge); }
    [hidden] { display: none !important; }
    .small { font-size: 13.5px; opacity: 0.65; margin: 0 0 30px; max-width: 36em; }

    /* The pitch: three lines on a paper card with a strip of tape. */
    .paper {
      position: relative;
      background: var(--paper);
      color: var(--ink);
      border-radius: 20px;
      padding: 26px 22px 12px;
      box-shadow: 0 6px 0 var(--paper-edge), 0 18px 40px rgba(0, 0, 0, 0.35);
      max-width: 520px;
    }
    .paper::before {
      content: '';
      position: absolute;
      top: -11px;
      left: 50%;
      width: 78px;
      height: 24px;
      margin-left: -39px;
      transform: rotate(-2deg);
      background: rgba(45, 224, 194, 0.6);
      border-radius: 2px;
    }
    .paper h3 { font-size: 18px; margin: 0 0 2px; }
    .paper p { margin: 0 0 14px; font-size: 14.5px; opacity: 0.78; }
    .paper div + div { border-top: 2px dashed rgba(27, 42, 56, 0.18); padding-top: 14px; }

    /* The demo, as a phone on the desk (wide screens only). */
    .phone-col { display: none; }
    .phone {
      width: 390px;
      height: 844px;
      transform-origin: top left;
      border-radius: 34px;
      overflow: hidden;
      background: var(--desk);
      box-shadow: 0 0 0 3px var(--key), 0 0 0 9px var(--key-edge), 0 30px 70px rgba(0, 0, 0, 0.55);
    }
    .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
    .phone-box { margin: 9px; }

    footer { margin-top: 44px; font-size: 13px; opacity: 0.6; }

    @media (min-width: 940px) {
      .page { padding-top: 30px; }
      .grid { grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 56px; }
      .phone-col { display: block; }
      .only-phone { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="mark">Verbora</div>
      <button class="lang" id="lang" type="button"></button>
    </header>

    <div class="grid">
      <main>
        <h1 data-en="Learn a language one word puzzle at a time"
            data-tr="Bulmaca çözerken dil öğren"></h1>
        <p class="lead"
           data-en="Verbora turns word puzzles into a language course: join the letters, find the word, learn what it means and how it sounds. English, Spanish, German, French and Italian."
           data-tr="Verbora, kelime bulmacalarını bir dil kursuna çevirir: harfleri birleştir, kelimeyi bul, anlamını ve okunuşunu öğren. İngilizce, İspanyolca, Almanca, Fransızca ve İtalyanca."></p>

        <div class="keys">
          <a class="key only-phone" id="play" href="app/" data-en="Play the demo" data-tr="Demoyu oyna"></a>
          <a class="key dark follow" target="_blank" rel="noopener" hidden data-en="Follow on Instagram" data-tr="Instagram'da takip et"></a>
        </div>
        <p class="small"
           data-en="The demo: the first 15 levels of all five languages. No sign-up; your progress stays in this browser."
           data-tr="Demo: beş dilin ilk 15 level'ı. Kayıt gerekmez; ilerlemen bu tarayıcıda kalır."></p>

        <div class="paper">
          <div>
            <h3 data-en="From A1 to C1" data-tr="A1'den C1'e"></h3>
            <p data-en="More than a thousand puzzles in each language, level by level."
               data-tr="Her dilde binden fazla bulmaca, seviye seviye."></p>
          </div>
          <div>
            <h3 data-en="Meet the words first" data-tr="Önce kelimeyle tanış"></h3>
            <p data-en="See them on cards, find them in the puzzle, keep them with the quiz."
               data-tr="Kartlarda gör, bulmacada bul, quiz'le pekiştir."></p>
          </div>
          <div>
            <h3 data-en="Repeats that stick" data-tr="Unutturmayan tekrar"></h3>
            <p data-en="A word never comes back straight away: at least 12 puzzles lie between two visits, and no word turns up more than 4 times."
               data-tr="Aynı kelime asla art arda gelmez: iki tekrar arasında en az 12 bulmaca vardır ve hiçbir kelime 4 kereden fazla karşına çıkmaz."></p>
          </div>
        </div>
      </main>

      <div class="phone-col">
        <div class="phone-box" id="phone-box">
          <div class="phone" id="phone"></div>
        </div>
      </div>
    </div>

    <footer>
      <span>© 2026 Verbora</span> ·
      <a href="privacy/" data-en="Privacy" data-tr="Gizlilik"></a>
      <span class="follow-wrap" hidden> · <a class="follow handle" target="_blank" rel="noopener"></a></span>
    </footer>
  </div>

  <script src="app/site.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var saved = null;
      try { saved = sessionStorage.getItem('verbora_lang'); } catch (e) {}
      var lang = params.get('lang') || saved || navigator.language || 'en';
      lang = lang.toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';

      function paint() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-en]').forEach(function (el) {
          el.textContent = el.getAttribute('data-' + lang);
        });
        document.getElementById('lang').textContent = lang === 'tr' ? 'English' : 'Türkçe';
        document.title = lang === 'tr'
          ? 'Verbora: bulmaca çözerken dil öğren'
          : 'Verbora: learn a language one word puzzle at a time';
      }
      paint();
      document.getElementById('lang').addEventListener('click', function () {
        lang = lang === 'tr' ? 'en' : 'tr';
        try { sessionStorage.setItem('verbora_lang', lang); } catch (e) {}
        paint();
      });

      // A link can name the language to try: ?l=de goes on to the demo.
      var learning = params.get('l');
      var demo = 'app/' + (learning ? '?l=' + encodeURIComponent(learning) : '');
      document.getElementById('play').href = demo;

      // The Instagram account to follow (app/site.js): a plain link, shown
      // only once an account is named there.
      var account = String((window.verboraSite || {}).instagram || '').replace(/^@/, '');
      if (/^[A-Za-z0-9._]{1,30}$/.test(account)) {
        document.querySelectorAll('a.follow').forEach(function (link) {
          link.href = 'https://www.instagram.com/' + account + '/';
          link.hidden = false;
          if (link.classList.contains('handle')) link.textContent = '@' + account;
        });
        document.querySelector('.follow-wrap').hidden = false;
      }

      // Wide screens: the demo in the phone, loaded when the phone is on
      // screen, scaled down when the window is short.
      var phone = document.getElementById('phone');
      var box = document.getElementById('phone-box');
      function fit() {
        // The phone (862 with its rim) under the header, whole on screen.
        var room = window.innerHeight - 128;
        var scale = Math.max(0.55, Math.min(1, room / 862));
        phone.style.transform = 'scale(' + scale + ')';
        box.style.width = 390 * scale + 'px';
        box.style.height = 844 * scale + 'px';
      }
      fit();
      window.addEventListener('resize', fit);

      function load() {
        if (phone.firstChild) return;
        var frame = document.createElement('iframe');
        frame.title = 'Verbora demo';
        frame.allow = 'autoplay';
        frame.src = demo + (learning ? '&' : '?') + 'embed=1';
        phone.appendChild(frame);
      }
      if (window.matchMedia('(min-width: 940px)').matches) {
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (entries, observer) {
            if (entries[0].isIntersecting) {
              load();
              observer.disconnect();
            }
          }).observe(phone);
        } else {
          load();
        }
      }
    })();
  </script>
</body>
</html>
