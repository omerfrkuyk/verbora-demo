<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    VERBORA — shown for an address the site does not have. It is served at
    that address, whatever its depth, so its links are absolute:
    tools/web_demo/build.sh fills in the site's path (/verbora-demo/).
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Verbora</title>
  <link rel="icon" type="image/png" href="/verbora-demo/app/favicon.png">
  <style>
    @font-face {
      font-family: 'Fredoka';
      font-weight: 600;
      font-display: swap;
      src: url('/verbora-demo/app/assets/assets/fonts/Fredoka-SemiBold.ttf') format('truetype');
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      box-sizing: border-box;
      background: #0D1F2D;
      color: #F4F1E8;
      text-align: center;
      font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .mark { font: 600 36px Fredoka, system-ui, sans-serif; color: #F4E3B8; }
    p { margin: 0; opacity: 0.8; max-width: 22em; }
    a.key {
      margin-top: 10px;
      border-radius: 16px;
      padding: 13px 22px;
      font: 600 18px Fredoka, system-ui, sans-serif;
      text-decoration: none;
      background: #C8FF3D;
      color: #1B2A38;
      box-shadow: 0 5px 0 #6F9A12;
    }
  </style>
</head>
<body>
  <div class="mark">Verbora</div>
  <p data-en="There is no page at this address." data-tr="Bu adreste bir sayfa yok."></p>
  <a class="key" href="/verbora-demo/" data-en="To the first page" data-tr="İlk sayfaya dön"></a>
  <script>
    (function () {
      var tr = (navigator.language || '').toLowerCase().indexOf('tr') === 0;
      document.documentElement.lang = tr ? 'tr' : 'en';
      document.querySelectorAll('[data-en]').forEach(function (el) {
        el.textContent = el.getAttribute(tr ? 'data-tr' : 'data-en');
      });
    })();
  </script>
</body>
</html>
