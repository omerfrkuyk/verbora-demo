<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    VERBORA — the web demo's page (served at /app/). The landing page (/)
    shows this page in a phone-shaped frame, or links to it on a phone.

    The base href below is replaced by `flutter build web --base-href /app/`
    (tools/web_demo/build.sh).
  -->
  <base href="/verbora-demo/app/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Closed to search engines until launch (tools/web_demo/build.sh --public removes it). -->
  <meta name="robots" content="noindex">
  <meta name="description" content="Verbora: word puzzles that teach you a language. Try the demo in English, Spanish, German, French or Italian.">
  <meta name="theme-color" content="#0D1F2D">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verbora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Verbora demo</title>

  <style>
    @font-face {
      font-family: 'Fredoka';
      font-weight: 600;
      font-display: swap;
      src: url('assets/assets/fonts/Fredoka-SemiBold.ttf') format('truetype');
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #0D1F2D;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #F4E3B8;
    }

    /* On a wide screen opened on its own, the app is a phone on the desk. */
    #stage { display: none; }
    body.wide #stage {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    body.wide #app {
      position: relative;
      width: min(430px, 100vw);
      height: min(932px, calc(100vh - 32px));
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 0 2px #1F4A66, 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    /* Shown at once, taken away at the app's first frame. */
    #loading, #blocked {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: #0D1F2D;
      text-align: center;
      transition: opacity 0.35s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading[hidden], #blocked[hidden] { display: none; }
    .mark {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 600;
      font-size: 40px;
      letter-spacing: 0.5px;
    }
    .note { font-size: 14px; opacity: 0.7; max-width: 300px; line-height: 1.45; }
    .bar {
      width: 180px;
      height: 10px;
      border-radius: 6px;
      background: #122A3D;
      box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .bar i {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 6px;
      background: #C8FF3D;
      animation: slide 1.1s ease-in-out infinite alternate;
    }
    @keyframes slide {
      from { transform: translateX(-20%); }
      to { transform: translateX(170%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar i { animation: none; width: 100%; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="stage"><div id="app"></div></div>

  <div id="loading" role="status">
    <div class="mark">Verbora</div>
    <div class="bar"><i></i></div>
    <div class="note" data-en="Setting up the puzzle table…" data-tr="Bulmaca masası hazırlanıyor…"></div>
  </div>

  <div id="blocked" hidden>
    <div class="mark">Verbora</div>
    <div class="note"
      data-en="The demo keeps your progress in this browser, and the browser does not allow it here. Turn off private mode or allow site data, then open the page again."
      data-tr="Demo ilerlemeni bu tarayıcıda saklar, ama tarayıcı burada buna izin vermiyor. Gizli modu kapat ya da site verilerine izin ver, sonra sayfayı yeniden aç."></div>
  </div>

  <script>
    // What flutter_bootstrap.js needs to know about this page.
    (function () {
      var tr = (navigator.language || '').toLowerCase().indexOf('tr') === 0;
      document.documentElement.lang = tr ? 'tr' : 'en';
      document.querySelectorAll('[data-en]').forEach(function (el) {
        el.textContent = el.getAttribute(tr ? 'data-tr' : 'data-en');
      });

      var page = (window.verboraPage = {});

      // The app saves to localStorage; without it it would not start.
      try {
        localStorage.setItem('verbora_probe', '1');
        localStorage.removeItem('verbora_probe');
      } catch (e) {
        page.blocked = true;
        document.getElementById('loading').hidden = true;
        document.getElementById('blocked').hidden = false;
        return;
      }

      // In the landing page's phone frame, or on a phone: the whole page.
      // On a wide screen, alone: a phone-sized box in the middle.
      var framed =
        new URLSearchParams(location.search).has('embed') ||
        window.self !== window.top;
      if (!framed && window.innerWidth >= 700) {
        document.body.classList.add('wide');
        page.host = document.getElementById('app');
      }

      window.addEventListener('flutter-first-frame', function () {
        var loading = document.getElementById('loading');
        loading.classList.add('done');
        setTimeout(function () {
          loading.remove();
        }, 400);
      });
    })();
  </script>
  <script src="site.js"></script>
  <script src="bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
